# See apps/gke/test/secret-provider-class.yaml for the full explanation —
# same mechanism, this environment's own Secret Manager secret.
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: ghost-db-secrets
spec:
  provider: gcp
  parameters:
    secrets: |
      # Placeholder — the real project number is only known once
      # infra/gcp/stages/2-projects has actually been applied.
      - resourceName: "projects/GCP_PROJECT_NUMBER_PLACEHOLDER/secrets/ghost-db-password-production/versions/latest"
        fileName: "database-password"
  secretObjects:
    - secretName: ghost-db-credentials
      type: Opaque
      data:
        - objectName: database-password
          key: database-password
