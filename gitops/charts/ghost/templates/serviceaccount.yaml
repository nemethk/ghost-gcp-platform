apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "ghost.fullname" . }}
  labels:
    {{- include "ghost.labels" . | nindent 4 }}
  {{- with .Values.serviceAccount.gcpServiceAccountEmail }}
  annotations:
    # Binds this Kubernetes ServiceAccount to a GCP service account via
    # Workload Identity — Ghost authenticates to Cloud SQL/Secret Manager
    # with no key file mounted into the pod. Demo track leaves this value
    # empty (no annotation at all): there's no GCP identity to bind to
    # locally, and a plain default-namespace ServiceAccount is enough for a
    # laptop demo.
    iam.gke.io/gcp-service-account: {{ . }}
  {{- end }}
