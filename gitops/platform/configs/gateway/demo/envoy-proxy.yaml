# Demo-only: pins Envoy Gateway's data-plane proxy Deployment onto the
# vCluster's control-plane node — the only node whose host ports Docker
# actually publishes (experimental.docker.ports in infra/demo/vclusters/
# <env>.yaml). Without this, the proxy pod could schedule onto "worker-1"
# instead and never be reachable at https://localhost:9443/8443/443, even
# though everything else in the cluster looks healthy. Mirrors kind's own
# nodeSelector+toleration pattern for its ingress controller.
#
# Real GKE has no equivalent node — a genuine cloud LoadBalancer gets an
# external IP regardless of which node the proxy lands on — so this resource
# is demo-track only, not part of gitops/platform/controllers/envoy-gateway/
# (which stays identical across demo and real GKE).
#
# node-role.kubernetes.io/control-plane confirmed present on a live vCluster.
#
# hostNetwork is required too — nodeSelector only controls scheduling; the
# pod still gets its own overlay-network IP otherwise, unreachable from
# Docker's port mapping. dnsPolicy must go with it (hostNetwork pods skip
# normal cluster DNS config by default).
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: EnvoyProxy
metadata:
  name: envoy-gateway-config
  namespace: envoy-gateway-system
spec:
  provider:
    type: Kubernetes
    kubernetes:
      envoyDeployment:
        pod:
          hostNetwork: true
          dnsPolicy: ClusterFirstWithHostNet
          nodeSelector:
            node-role.kubernetes.io/control-plane: "true"
          tolerations:
            - key: node-role.kubernetes.io/control-plane
              operator: Exists
              effect: NoSchedule
        # This is the data-plane proxy handling live traffic, not the
        # controller (bounded separately in
        # gitops/platform/controllers/envoy-gateway/release.yaml) — a bit
        # more headroom than the controller gets.
        container:
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
