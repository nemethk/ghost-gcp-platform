# Envoy Gateway's own CRDs (EnvoyProxy, ClientTrafficPolicy, ...), installed
# separately from its Gateway API CRDs. release.yaml's chart bundles both by
# default (crds.enabled: true), but its Gateway API CRDs are the
# "experimental" channel — which collides with the standard-channel
# ValidatingAdmissionPolicy our own gateway-api-crds installs
# (safe-upgrades.gateway.networking.k8s.io blocks installing experimental
# CRDs on top of standard-channel ones). We already own the Gateway API CRDs
# ourselves; this release installs only Envoy Gateway's half of the bundle —
# see https://github.com/envoyproxy/gateway/blob/main/charts/gateway-crds-helm/README.md
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: envoy-gateway-crds
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: envoy-gateway-crds
  targetNamespace: envoy-gateway-system
  values:
    crds:
      gatewayAPI:
        enabled: false
      envoyGateway:
        enabled: true
