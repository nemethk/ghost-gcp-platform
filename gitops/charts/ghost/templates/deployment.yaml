apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "ghost.fullname" . }}
  labels:
    {{- include "ghost.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  strategy:
    type: {{ .Values.updateStrategy }}
  selector:
    matchLabels:
      {{- include "ghost.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "ghost.selectorLabels" . | nindent 8 }}
    spec:
      containers:
        - name: ghost
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 2368
              protocol: TCP
          env:
            - name: NODE_ENV
              value: "production"
            - name: url
              value: {{ .Values.ghost.url | quote }}
            - name: database__client
              value: {{ .Values.ghost.database.client | quote }}
            - name: database__connection__host
              value: {{ .Values.ghost.database.host | quote }}
            - name: database__connection__port
              value: {{ .Values.ghost.database.port | quote }}
            - name: database__connection__database
              value: {{ .Values.ghost.database.name | quote }}
            - name: database__connection__user
              value: {{ .Values.ghost.database.user | quote }}
            - name: database__connection__password
              valueFrom:
                secretKeyRef:
                  name: {{ required "ghost.database.existingSecret is required" .Values.ghost.database.existingSecret }}
                  key: {{ .Values.ghost.database.passwordKey }}
          {{- if .Values.persistence.enabled }}
          volumeMounts:
            - name: content
              mountPath: /var/lib/ghost/content
          {{- end }}
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: {{ .Values.probes.liveness.initialDelaySeconds }}
            periodSeconds: {{ .Values.probes.liveness.periodSeconds }}
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: {{ .Values.probes.readiness.initialDelaySeconds }}
            periodSeconds: {{ .Values.probes.readiness.periodSeconds }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      {{- if .Values.persistence.enabled }}
      volumes:
        - name: content
          persistentVolumeClaim:
            claimName: {{ include "ghost.fullname" . }}-content
      {{- end }}
