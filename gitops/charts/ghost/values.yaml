# replicas is deliberately fixed at 1 — not a limitation of this chart, a
# constraint of Ghost itself. Ghost's own docs: "Ghost doesn't support
# load-balanced clustering or multi-server setups of any description, there
# should only be one Ghost instance per site"
# (https://docs.ghost.org/faq/clustering-sharding-multi-server/). Running
# multiple instances causes real failures there (405s, instances needing
# constant restarts), not just the duplicate scheduled-post/email risk this
# repo would otherwise expect from Ghost's in-process scheduler having no
# cross-instance coordination. There is no HPA in this chart for the same
# reason. Availability comes from Kubernetes' own fast rescheduling on
# failure, not from redundant replicas; real capacity comes from vertical
# `resources` (see apps/gke/<env>/ghost-values.yaml) and, per Ghost's own
# recommended scale/HA path, a cache/CDN layer in front — see
# docs/architecture.md.
replicaCount: 1

image:
  repository: ghost
  tag: "6.39.0"
  pullPolicy: IfNotPresent

serviceAccount:
  # Empty on the demo track (no annotation rendered at all — see
  # templates/serviceaccount.yaml). Real GKE sets this to the GCP service
  # account email Workload Identity binds Ghost's pods to, for Cloud
  # SQL/Secret Manager access with no key file mounted into the pod.
  gcpServiceAccountEmail: ""

# Recreate, not RollingUpdate: the content PVC is mounted by a single pod at a
# time. A rolling update would try to start the new pod (and mount the volume)
# before the old one releases it.
updateStrategy: Recreate

service:
  type: ClusterIP
  port: 2368

# TLS termination happens on the shared, platform-owned Gateway (see
# gitops/platform/configs/gateway/), not per-app — the chart only needs to
# know which Gateway to attach to and which hostname to match.
#
# hostname is a real field, not a demo-only workaround: Gateway API's
# Hostname type validates as an RFC-1123 DNS subdomain (dns1123Subdomain),
# which doesn't require multiple labels — "localhost" is structurally valid
# even though it isn't a real FQDN. TLS SNI never includes a port, and
# implementations match HTTPRoute hostnames against the Host header with the
# port stripped, so this value is correct regardless of which port (9443/
# 8443/443) is actually used. On the real-GCP track this same field holds a
# genuine FQDN — this is the demo-track's value, not a different mechanism.
httpRoute:
  enabled: true
  gatewayName: ghost
  hostname: localhost

persistence:
  enabled: true
  size: 1Gi
  storageClassName: ""
  accessMode: ReadWriteOnce

ghost:
  # Ghost's own config key is the bare "url" env var (no prefix) — matches the
  # database__connection__* nesting convention, confirmed against a working
  # reference deployment.
  url: "https://localhost:9443"
  database:
    client: mysql
    host: mysql
    port: 3306
    name: ghost
    user: ghost
    # Name of a pre-existing Secret holding the password — created out of
    # band (a Makefile-generated, never-committed Secret for the local
    # demo; on real GKE, synced from Secret Manager by the Secrets Store
    # CSI driver — see secretProviderClass below). This chart never creates
    # or contains the secret itself.
    existingSecret: ""
    passwordKey: database-password
    # Name of a SecretProviderClass (apps/gke/<env>/secret-provider-class.yaml)
    # whose secretObjects sync target is existingSecret above. Empty on the
    # demo track — no CSI volume is mounted at all when unset (see
    # templates/deployment.yaml).
    secretProviderClass: ""

resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    cpu: 500m
    memory: 512Mi

# Off by default: with replicaCount 1, a PDB's maxUnavailable can only
# meaningfully be 0, which blocks every voluntary node drain (upgrades,
# maintenance) for as long as this is the only replica. Real tradeoff, not a
# free win — enable deliberately per environment, not as a default.
podDisruptionBudget:
  enabled: false
  maxUnavailable: 0

probes:
  liveness:
    initialDelaySeconds: 30
    periodSeconds: 15
  readiness:
    initialDelaySeconds: 10
    periodSeconds: 10
