# Pulls the Cloud SQL password Terraform's 5-databases stage generated and
# wrote to Secret Manager (google_secret_manager_secret.db_password["test"],
# secret_id "ghost-db-password-test") — never duplicated into a
# SOPS-encrypted secrets.enc.yaml the way the demo track does it, per the
# infra-level-secrets-via-Secret-Manager split.
#
# secretObjects makes the CSI driver also create a plain Kubernetes Secret
# (ghost-db-credentials) from the mounted value — Ghost's Deployment reads
# it via a normal secretKeyRef (see ghost-values.yaml), same as demo. Only
# how that Secret comes to exist differs.
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: ghost-db-secrets
spec:
  provider: gcp
  parameters:
    secrets: |
      # Placeholder — the real project number is only known once
      # infra/gcp/stages/2-projects has actually been applied.
      - resourceName: "projects/GCP_PROJECT_NUMBER_PLACEHOLDER/secrets/ghost-db-password-test/versions/latest"
        fileName: "database-password"
  secretObjects:
    - secretName: ghost-db-credentials
      type: Opaque
      data:
        - objectName: database-password
          key: database-password
