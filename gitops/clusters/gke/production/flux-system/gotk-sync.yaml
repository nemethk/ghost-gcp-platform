# See ../../test/flux-system/gotk-sync.yaml for the full explanation of why
# this is committed rather than Terraform-managed. This is the file
# .github/CODEOWNERS actually gates — a pinned tag, changed only via a
# reviewed PR, matching the demo track's promotion-gate design.
apiVersion: source.toolkit.fluxcd.io/v1
kind: GitRepository
metadata:
  name: flux-system
  namespace: flux-system
spec:
  interval: 1m0s
  ref:
    # Placeholder — no tag has been cut yet. Real promotion means editing
    # this field via a reviewed PR, not picking a value now.
    tag: v0.1.0
  url: https://github.com/nemethk/ghost-gcp-platform
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: flux-system
  namespace: flux-system
spec:
  interval: 10m0s
  path: ./gitops/clusters/gke/production
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
