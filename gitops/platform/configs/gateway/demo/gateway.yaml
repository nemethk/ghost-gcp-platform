# One shared Gateway manifest — the hostname differs per environment
# (ghost.test.local / ghost.acceptance.local / ghost.local), substituted by
# Flux via ${GHOST_HOSTNAME} (set in each env's clusters/<env>/
# configs-kustomization.yaml). Reached via vind's built-in per-Service
# LoadBalancer/HAProxy container (examples/vcluster-docker/documentation/
# LB.md) — each environment gets its own bridge IP, mapped locally in
# /etc/hosts. Same port (443) everywhere — the hostname/IP is what
# differentiates environments now, not the port.
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: ghost
  namespace: ghost
  annotations:
    cert-manager.io/cluster-issuer: ghost-selfsigned
spec:
  gatewayClassName: envoy-gateway
  listeners:
    - name: https
      protocol: HTTPS
      port: 443
      hostname: ${GHOST_HOSTNAME}
      tls:
        mode: Terminate
        certificateRefs:
          - kind: Secret
            name: ghost-tls
