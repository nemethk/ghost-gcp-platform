<svg width="1280" height="720" viewBox="0 0 1280 720" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="wash" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FAFAF9"/>
      <stop offset="55%" stop-color="#F3F6FC"/>
      <stop offset="100%" stop-color="#EAF1FD"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#2563EB" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#2563EB" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="30"/>
    </filter>
  </defs>

  <rect width="1280" height="720" fill="url(#wash)"/>
  <g filter="url(#soft)">
    <circle cx="1090" cy="540" r="330" fill="url(#glow)"/>
  </g>

  <!-- The three ideas the deck is about, drawn as one quiet scene,
       bottom-right, clear of the title text: on-prem today, migrating via
       GitOps' continuous sync (not a one-time cutover), landing in a
       Kubernetes cluster inside the cloud. -->
  <g stroke="#2563EB" fill="none" stroke-width="1.75">

    <!-- ON-PREM: a small server rack, grounded on a base line -->
    <g stroke-opacity="0.45" transform="translate(755,555)">
      <rect x="0" y="0" width="72" height="19" rx="2"/>
      <rect x="0" y="25" width="72" height="19" rx="2"/>
      <rect x="0" y="50" width="72" height="19" rx="2"/>
      <line x1="-6" y1="75" x2="78" y2="75" stroke-opacity="0.3"/>
      <g fill="#2563EB" fill-opacity="0.5" stroke="none">
        <circle cx="9" cy="9.5" r="2"/>
        <circle cx="9" cy="34.5" r="2"/>
        <circle cx="9" cy="59.5" r="2"/>
      </g>
      <g stroke-opacity="0.3">
        <line x1="20" y1="9.5" x2="60" y2="9.5"/>
        <line x1="20" y1="34.5" x2="60" y2="34.5"/>
        <line x1="20" y1="59.5" x2="60" y2="59.5"/>
      </g>
    </g>

    <!-- GITOPS: migration path, marked with a continuous-sync icon rather
         than a one-way arrow — the point isn't a single cutover, it's an
         ongoing reconciliation loop -->
    <path d="M 845 585 C 880 565, 895 560, 915 552" stroke-dasharray="5 6" stroke-opacity="0.35"/>
    <g transform="translate(893,528) scale(1.5)" stroke-opacity="0.55" stroke-width="1.6" stroke-linecap="round">
      <path d="M23 4v6h-6"/>
      <path d="M1 20v-6h6"/>
      <path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10"/>
      <path d="M1 14l4.64 4.36A9 9 0 0 0 20.49 15"/>
    </g>
    <path d="M 950 545 C 970 540, 985 535, 1000 528" stroke-dasharray="5 6" stroke-opacity="0.35"/>

    <!-- small git-branch mark, reinforcing "git" specifically -->
    <g transform="translate(870,600) scale(1.1)" stroke-opacity="0.4" stroke-width="1.6" stroke-linecap="round">
      <path d="M6 3v12"/>
      <circle cx="6" cy="18" r="3"/>
      <circle cx="6" cy="3" r="3"/>
      <circle cx="18" cy="6" r="3"/>
      <path d="M18 9a9 9 0 0 1-9 9"/>
    </g>

    <!-- CLOUD: a proper cloud silhouette, containing a small Kubernetes-
         style node cluster -->
    <g transform="translate(978,412) scale(8.6)" stroke-opacity="0.4" stroke-width="0.85">
      <path d="M19.35 10.04C18.67 6.59 15.64 4 12 4 9.11 4 6.6 5.64 5.35 8.04 2.34 8.36 0 10.91 0 14c0 3.31 2.69 6 6 6h13c2.76 0 5-2.24 5-5 0-2.64-2.05-4.78-4.65-4.96z"/>
    </g>

    <g stroke-opacity="0.55" stroke-width="1.6" transform="translate(1044,479)">
      <polygon points="14,0 28,8 28,24 14,32 0,24 0,8"/>
      <polygon points="60,0 74,8 74,24 60,32 46,24 46,8"/>
      <polygon points="37,40 51,48 51,64 37,72 23,64 23,48"/>
      <g stroke-opacity="0.35">
        <line x1="14" y1="16" x2="37" y2="56"/>
        <line x1="60" y1="16" x2="37" y2="56"/>
        <line x1="14" y1="16" x2="60" y2="16"/>
      </g>
      <g fill="#2563EB" fill-opacity="0.55" stroke="none">
        <circle cx="14" cy="16" r="2.5"/>
        <circle cx="60" cy="16" r="2.5"/>
        <circle cx="37" cy="56" r="2.5"/>
      </g>
    </g>
  </g>
</svg>
