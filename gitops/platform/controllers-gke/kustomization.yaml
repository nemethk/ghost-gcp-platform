# gke's counterpart to platform/controllers/kustomization.yaml — the three
# shared controllers plus the gke-only Secrets Store CSI driver. Referenced
# by directory (each has its own kustomization.yaml), not by file, so this
# stays within Kustomize's cross-directory restriction the same way
# platform/configs-gke/ does.
#
# monitoring, unlike demo, runs on all three real environments — no laptop
# resource budget to work around (release-kube-prometheus-stack.yaml).
# Referenced directly from ../controllers/monitoring, not duplicated: it
# already self-stamps its own namespace, and nothing about its Helm values
# is currently known to need to differ between demo and gke (unlike
# secrets-store-csi, which is gke-only tooling with no demo equivalent at
# all).
#
# No `namespace:` set here on purpose — it would cascade down and override
# secrets-store-csi/gcp-provider/'s hardcoded kube-system namespace too,
# not just fill in the blanks on cert-manager/envoy-gateway's own resources
# (which don't need it from here anymore — each stamps itself now).
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../controllers/gateway-api-crds
  - ../controllers/envoy-gateway
  - ../controllers/cert-manager
  - ../controllers/monitoring
  - secrets-store-csi
