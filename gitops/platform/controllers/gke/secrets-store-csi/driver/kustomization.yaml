# namespace stamped here, not left to the parent — the sibling
# ../gcp-provider/ needs the opposite (its own hardcoded kube-system left
# untouched), so nothing above this level may set namespace: blanket-wide.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: flux-system
resources:
  - repository.yaml
  - release.yaml
