apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: configs
  namespace: flux-system
spec:
  interval: 5m
  path: ./gitops/platform/configs-gke
  prune: true
  dependsOn:
    - name: controllers
  sourceRef:
    kind: GitRepository
    name: flux-system
  decryption:
    provider: sops
    secretRef:
      name: sops-age
  postBuild:
    substitute:
      # Placeholder — the real domain is managed at GoDaddy, not decided in
      # code. Replace before this stage is ever synced for real.
      GHOST_HOSTNAME: ghost.acceptance.example.com
      # Real, deterministic value — same nonprod VPC as Test (shared
      # compute, per infra/gcp/stages/3-networking).
      GKE_VPC_NAME: ghost-nonprod
      # Placeholder — the real value is infra/gcp/stages/3-networking's
      # ghost_lb_ips["acceptance"] output (a GCP-assigned address, only
      # known once that stage has actually been applied). A separate
      # reserved IP from Test's, even though they share the nonprod VPC —
      # each environment gets its own Envoy Gateway LoadBalancer.
      GKE_STATIC_IP: 0.0.0.0
