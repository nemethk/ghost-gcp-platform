{{- if .Values.httpRoute.enabled }}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ include "ghost.fullname" . }}
  labels:
    {{- include "ghost.labels" . | nindent 4 }}
spec:
  parentRefs:
    - name: {{ .Values.httpRoute.gatewayName }}
  hostnames:
    - {{ .Values.httpRoute.hostname | quote }}
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      filters:
        - type: ResponseHeaderModifier
          responseHeaderModifier:
            set:
              # Derived from Chart.yaml's own version, not a separate values
              # field — nothing to forget to keep in sync. BRANCH.md already
              # requires Chart.yaml's version to track the git tag, so this
              # is a direct, automatic reflection of that, not a second
              # manually-maintained value.
              - name: X-Chart-Version
                value: {{ .Chart.Version | quote }}
      backendRefs:
        - name: {{ include "ghost.fullname" . }}
          port: {{ .Values.service.port }}
{{- end }}
