# Only bounds the data-plane proxy's resources now — no node-pinning needed.
# Ghost is reached via vind's built-in per-Service LoadBalancer/HAProxy
# container (LB.md), which forwards to the proxy's Service regardless of
# which node the pod actually lands on. The earlier hostNetwork/nodeSelector
# approach (for making Docker's own port-publishing reach the proxy
# directly) was abandoned — EnvoyProxy's pod schema doesn't even expose
# hostNetwork/dnsPolicy as fields, and the LoadBalancer path works without
# any of that.
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: EnvoyProxy
metadata:
  name: envoy-gateway-config
  namespace: envoy-gateway-system
spec:
  provider:
    type: Kubernetes
    kubernetes:
      envoyDeployment:
        # This is the data-plane proxy handling live traffic, not the
        # controller (bounded separately in
        # gitops/platform/controllers/envoy-gateway/release.yaml) — a bit
        # more headroom than the controller gets.
        container:
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
