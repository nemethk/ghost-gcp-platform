# Demo track: Test-only (see gitops/clusters/demo/test/monitoring-kustomization.yaml)
# — laptop resource budget (7 threads/16GB, shared across 3 vClusters)
# doesn't fit the full stack running 3x simultaneously. Real GKE has no such
# constraint, so these same manifests run unchanged on all three real
# environments (gitops/platform/controllers-gke/kustomization.yaml) — the
# Test-only restriction was always a demo-track scope decision, not a
# technical limitation of the manifests themselves.
#
# kubeControllerManager/kubeScheduler/kubeEtcd/kubeProxy monitors are disabled
# everywhere, demo and real GKE alike: they scrape a real kubeadm control
# plane's static pods. Demo's vClusters don't expose one (virtual API server);
# real GKE's control plane is Google-managed and not scrapeable from inside
# the cluster either — in both cases these would just be permanently-failing
# targets, not real signal.
#
# All resources set explicitly below — the chart's own defaults for several
# components are effectively unbounded, which isn't safe on a shared laptop.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kube-prometheus-stack
spec:
  interval: 5m
  chart:
    spec:
      chart: kube-prometheus-stack
      sourceRef:
        kind: HelmRepository
        name: prometheus-community
  targetNamespace: monitoring
  values:
    kubeControllerManager:
      enabled: false
    kubeScheduler:
      enabled: false
    kubeEtcd:
      enabled: false
    kubeProxy:
      enabled: false
    prometheusOperator:
      resources:
        requests:
          cpu: 50m
          memory: 64Mi
        limits:
          cpu: 100m
          memory: 128Mi
    prometheus:
      prometheusSpec:
        retention: 6h
        resources:
          requests:
            cpu: 250m
            memory: 512Mi
          limits:
            cpu: 500m
            memory: 1Gi
    alertmanager:
      alertmanagerSpec:
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            cpu: 100m
            memory: 128Mi
    kube-state-metrics:
      resources:
        requests:
          cpu: 50m
          memory: 64Mi
        limits:
          cpu: 100m
          memory: 128Mi
    prometheus-node-exporter:
      resources:
        requests:
          cpu: 25m
          memory: 32Mi
        limits:
          cpu: 50m
          memory: 64Mi
    grafana:
      resources:
        requests:
          cpu: 100m
          memory: 128Mi
        limits:
          cpu: 250m
          memory: 256Mi
      # Prometheus is wired in automatically by this chart; Loki is the one
      # extra datasource actually needed.
      additionalDataSources:
        - name: Loki
          type: loki
          url: http://loki.monitoring.svc.cluster.local:3100
          access: proxy
      # searchNamespace: ALL — dashboards live with the app they're about
      # (gitops/apps/base/ghost/dashboard.yaml, in the ghost namespace), not
      # bundled into this chart's own namespace. Sidecar is on by default;
      # this just widens where it looks.
      sidecar:
        dashboards:
          enabled: true
          searchNamespace: ALL
          label: grafana_dashboard
          labelValue: "1"
